name: Backup graph to repo

# Aura Free has no self-service dump/restore (that's a paid-tier feature, and
# there's no shell/filesystem access to a managed instance anyway). This
# exports all nodes/relationships via the driver and commits them to
# backups/latest.json — git history on that one file gives dated rollback
# points without the repo growing unbounded. Requires the same NEO4J_* repo
# secrets as the keep-alive-aura workflow.
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export graph to JSON
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          if [ -z "$NEO4J_URI" ]; then
            echo "NEO4J_URI secret not set yet — skipping (set it once Aura is provisioned)."
            exit 0
          fi
          pip install --quiet neo4j
          mkdir -p backups
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone

          from neo4j import GraphDatabase

          driver = GraphDatabase.driver(
              os.environ["NEO4J_URI"],
              auth=(os.environ["NEO4J_USER"], os.environ["NEO4J_PASSWORD"]),
          )

          with driver.session() as session:
              nodes = session.run(
                  "MATCH (n) RETURN labels(n) AS labels, properties(n) AS props"
              ).data()
              rels = session.run(
                  "MATCH (a)-[r]->(b) "
                  "RETURN a.id AS source_id, type(r) AS rel_type, "
                  "properties(r) AS props, b.id AS target_id"
              ).data()

          dump = {
              "exported_at": datetime.now(timezone.utc).isoformat(),
              "node_count": len(nodes),
              "relationship_count": len(rels),
              "nodes": nodes,
              "relationships": rels,
          }

          with open("backups/latest.json", "w") as f:
              json.dump(dump, f, indent=2, default=str)

          print(f"Exported {len(nodes)} nodes, {len(rels)} relationships.")
          driver.close()
          EOF

      - name: Commit backup if changed
        run: |
          if [ ! -f backups/latest.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/latest.json
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: automated graph backup"
          git push
