name: Keep Aura Free instance awake

# AuraDB Free auto-pauses after ~72h of inactivity (manual-only resume, no
# auto-wake on connection). Running a trivial query every 24h keeps it active.
# Requires repo secrets NEO4J_URI / NEO4J_USER / NEO4J_PASSWORD (from your
# downloaded Aura credentials file) to be set before this can do anything —
# see README "Hosting setup" section.
on:
  schedule:
    - cron: "17 */24 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ping Aura with a trivial query
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          pip install --quiet neo4j
          python - <<'EOF'
          import os
          from neo4j import GraphDatabase

          uri = os.environ["NEO4J_URI"]
          user = os.environ["NEO4J_USER"]
          password = os.environ["NEO4J_PASSWORD"]

          driver = GraphDatabase.driver(uri, auth=(user, password))
          with driver.session() as session:
              result = session.run("RETURN 1 AS ok")
              print("Aura keep-alive query result:", result.single()["ok"])
          driver.close()
          EOF
